name: cloud-${APP_NAME}-prod

# Cloud deployment test environment.
# Deploy only pre-built React dist files and WAR artifacts.
# Application source directories and Vite development servers are not required.

services:
  nginx-staticweb:
    image: "nginx:${NGINX_VERSION}"
    container_name: nginx-staticweb-${APP_NAME}-cloud
    ports:
      - "${NGINX_BIND_ADDRESS}:${NGINX_PORT}:80"
    volumes:
      - "${NGINX_PROD_CONFIG:-./nginx/default.prod.conf}:/etc/nginx/conf.d/default.conf:ro"
      - "${WEB_DIST_PATH:-./dist}:/usr/share/nginx/html:ro"
    depends_on:
      - tomcat-frontend
    restart: unless-stopped
    networks:
      - web-network

  tomcat-frontend:
    build:
      context: .
      dockerfile: "${TOMCAT_DOCKERFILE}"
      args:
        TOMCAT_VERSION: "${TOMCAT_VERSION}"
    image: "${TOMCAT_IMAGE}"
    container_name: tomcat-frontend-${APP_NAME}-cloud
    volumes:
      - "${WAR_PATH:-./war/frontend.war}:/usr/local/tomcat/webapps/ROOT.war:ro"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
