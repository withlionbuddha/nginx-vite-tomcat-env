name: integrated-${APP_NAME}-dev

services:
  nginx-staticweb:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vite-devserver
      - tomcat-frontend
    restart: unless-stopped
    networks:
      - web-network

  vite-devserver:
    build:
      context: .
      dockerfile: vite-devserver/Dockerfile.dev
    container_name: vite-devserver-${APP_NAME}
    working_dir: /workspace/react-web-ui
    init: true
    ports:
      - "${VITE_BIND_ADDRESS:-127.0.0.1}:${VITE_PORT:-8183}:8183"
    volumes:
      - type: bind
        source: "${WEB_UI_SOURCE_PATH:-../react-web-ui}"
        target: /workspace/react-web-ui
        bind:
          create_host_path: true
      - type: bind
        source: "${REFERENCE_UI_SOURCE_PATH:-../reactex/bulletproof-react}"
        target: /workspace/reference-ui
        bind:
          create_host_path: true
      - type: bind
        source: "${FRONTEND_SOURCE_PATH:-../frontend}"
        target: /workspace/frontend
        bind:
          create_host_path: true
      - vite_node_modules:/workspace/react-web-ui/node_modules
    environment:
      WEB_UI_PATH: /workspace/react-web-ui
      REFERENCE_UI_PATH: /workspace/reference-ui
      FRONTEND_PATH: /workspace/frontend
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    command: >
      sh -c "if [ ! -f package.json ]; then
               echo 'Main React source not found; keeping Vite container available without starting Vite.';
               exec tail -f /dev/null;
             fi;
             if [ ! -x node_modules/.bin/vite ]; then yarn install; fi &&
             exec yarn dev --host 0.0.0.0 --port 8183"
    networks:
      - web-network

  ref-vite-devserver:
    image: node:24.20.0-bookworm
    container_name: ref-vite-devserver-${APP_NAME}
    working_dir: /workspace/reference-ui/apps/react-vite
    init: true
    ports:
      - "${REFERENCE_UI_BIND_ADDRESS:-127.0.0.1}:${REFERENCE_UI_PORT:-8184}:8184"
    volumes:
      - type: bind
        source: "${REFERENCE_UI_SOURCE_PATH:-../reactex/bulletproof-react}"
        target: /workspace/reference-ui
        bind:
          create_host_path: true
      - ref_vite_node_modules:/workspace/reference-ui/apps/react-vite/node_modules
    environment:
      REFERENCE_UI_PATH: /workspace/reference-ui
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    command: >
      sh -c "if [ ! -f package.json ]; then
               echo 'Reference React source not found; keeping reference Vite container available without starting Vite.';
               exec tail -f /dev/null;
             fi;
             if [ ! -x node_modules/.bin/vite ]; then yarn install; fi &&
             exec yarn dev --host 0.0.0.0 --port 8184"
    networks:
      - web-network

  tomcat-frontend:
    build:
      context: .
      dockerfile: tomcat-frontend/Dockerfile
    image: tomcat-frontend:${APP_NAME}
    container_name: tomcat-frontend-${APP_NAME}
    ports:
      - "${FRONTWAS_BIND_ADDRESS:-127.0.0.1}:${FRONTWAS_PORT:-18080}:8080"
    restart: unless-stopped
    networks:
      - web-network

volumes:
  vite_node_modules:
  ref_vite_node_modules:

networks:
  web-network:
    driver: bridge
