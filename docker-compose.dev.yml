name: integrated-${APP_NAME}-dev

services:
  nginx-staticweb:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
      args:
        NGINX_CONFIG: ${NGINX_CONFIG}
        SSL_DIR_PATH: ${SSL_TARGET_DIR_PATH}
        NODE_VERSION: ${NODE_VERSION}
      additional_contexts:
        web_ui_source: "${WEB_UI_SOURCE_PATH:-../react-web-ui}"
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${NGINX_HOST_ADDRESS:-127.0.0.1}:${NGINX_HOST_PORT:-80}:${NGINX_CONTAINER_PORT:-80}"
      - "${NGINX_HOST_ADDRESS:-127.0.0.1}:${NGINX_HOST_SSL_PORT:-443}:${NGINX_CONTAINER_SSL_PORT:-443}"
    env_file: #컨테이너 내부에 환경변수 전달용 env file
      - ./nginx/nginx.env
    volumes:
      - type: bind 
        source: ${SSL_SOURCE_DIR_PATH}
        target: ${SSL_TARGET_DIR_PATH}
        read_only: true
    depends_on:
      - vite-devserver
      - tomcat-frontend
    restart: unless-stopped
    networks:
      - web-network

  vite-devserver:
    build:
      context: .
      dockerfile: vite/Dockerfile.dev 
      args:
         NODE_VERSION: ${NODE_VERSION}
    container_name: vite-devserver-${APP_NAME}
    working_dir: /workspace/react-web-ui
    init: true
    ports:
      - "${VITE_HOST_ADDRESS:-127.0.0.1}:${VITE_HOST_PORT:-83}:${VITE_CONTAINER_PORT:-83}"
    env_file: #컨테이너 내부에 환경변수 전달용 env file
      - ./vite/vite.env
    volumes:
      - type: bind
        source: "${WEB_UI_SOURCE_PATH:-../react-web-ui}"
        target: /workspace/react-web-ui
        bind:
          create_host_path: true
      - type: bind
        source: "${FRONTEND_SOURCE_PATH:-../frontend}"
        target: /workspace/frontend
        bind:
          create_host_path: true
      - type: bind
        source: vite_node_modules
        target: /workspace/react-web-ui/node_modules
    environment:
      WEB_UI_PATH: /workspace/react-web-ui
      FRONTEND_PATH: /workspace/frontend
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    command: >
      sh -c "if [ ! -f package.json ]; then
               echo 'Main React source not found; keeping Vite container available without starting Vite.';
               exec tail -f /dev/null;
             fi;
             if [ ! -x node_modules/.bin/vite ]; then yarn install; fi &&
             exec yarn dev --host 0.0.0.0 --port 83"
    networks:
      - web-network

  tomcat-frontend:
    working_dir: /workspace
    volumes:
      - ${FRONTEND_SOURCE_PATH}:/workspace
      - maven-repository:/root/.m2/repository
      - ${FRONTEND_SOURCE_WAR_PATH}:/usr/local/tomcat/webapps
    build:
      context: .
      dockerfile: tomcat/Dockerfile.dev
      args:
        TOMCAT_VERSION: ${TOMCAT_VERSION:-10.1.59-jre21-temurin-noble}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.11}
    image: tomcat-frontend:${APP_NAME:-earth-power-n4}-dev
    container_name: tomcat-frontend--${APP_NAME:-earth-power-n4}-dev
    ports:
      - "${FRONTWAS_HOST_ADDRESS:-127.0.0.1}:${FRONTWAS_HOST_PORT:-8080}:${FRONTWAS_CONTAINER_PORT:-8080}"
    env_file: #컨테이너 내부에 환경변수 전달용 env file
      - ./tomcat/tomcat.env
    restart: unless-stopped
    networks:
      - web-network

  redis:
    image: redis:7.4-alpine
    container_name: redis-${APP_NAME:-earth-power-n4}-dev
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
       - "${REDIS_HOST_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"
    restart: unless-stopped
    networks:
      - web-network

volumes:
  vite_node_modules:
  maven-repository:
  redis-data:

networks:
  web-network:
    driver: bridge
  
