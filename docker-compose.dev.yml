name: integrated-${APP_NAME}-dev

services:
  nginx-staticweb:
    image: "${NGINX_IMAGE}"
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${NGINX_BIND_ADDRESS}:${NGINX_PORT}:${NGINX_CONTAINER_PORT}"
    volumes:
      - "${NGINX_DEV_CONFIG}:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - vite-devserver
      - tomcat-frontend
    restart: unless-stopped
    networks:
      - web-network

  vite-devserver:
    build:
      context: .
      dockerfile: "${VITE_DOCKERFILE}"
    container_name: vite-devserver-${APP_NAME}
    working_dir: "${WEB_UI_CONTAINER_PATH}"
    init: true
    ports:
      - "${VITE_BIND_ADDRESS}:${VITE_PORT}:${VITE_CONTAINER_PORT}"
    volumes:
      - type: bind
        source: "${WEB_UI_SOURCE_PATH}"
        target: "${WEB_UI_CONTAINER_PATH}"
        bind:
          create_host_path: true
      - type: bind
        source: "${REFERENCE_UI_SOURCE_PATH}"
        target: "${REFERENCE_UI_CONTAINER_PATH}"
        bind:
          create_host_path: true
      - type: bind
        source: "${FRONTEND_SOURCE_PATH}"
        target: "${FRONTEND_CONTAINER_PATH}"
        bind:
          create_host_path: true
      - "vite_node_modules:${WEB_UI_CONTAINER_PATH}/node_modules"
    environment:
      WEB_UI_PATH: "${WEB_UI_CONTAINER_PATH}"
      REFERENCE_UI_PATH: "${REFERENCE_UI_CONTAINER_PATH}"
      FRONTEND_PATH: "${FRONTEND_CONTAINER_PATH}"
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING}"
    command: >
      sh -c "if [ ! -f package.json ]; then
               echo 'Dev React source not found; starting fallback Vite server.';
               exec /opt/vite-fallback/node_modules/.bin/vite /opt/vite-fallback --host 0.0.0.0 --port ${VITE_CONTAINER_PORT};
             fi;
             if [ ! -x node_modules/.bin/vite ]; then yarn install; fi &&
             exec yarn dev --host 0.0.0.0 --port ${VITE_CONTAINER_PORT}"
    networks:
      - web-network

  ref-vite-devserver:
    build:
      context: .
      dockerfile: "${VITE_DOCKERFILE}"
    container_name: ref-vite-devserver-${APP_NAME}
    working_dir: "${REFERENCE_UI_WORKING_DIR}"
    init: true
    ports:
      - "${REFERENCE_UI_BIND_ADDRESS}:${REFERENCE_UI_PORT}:${REFERENCE_UI_CONTAINER_PORT}"
    volumes:
      - type: bind
        source: "${REFERENCE_UI_SOURCE_PATH}"
        target: "${REFERENCE_UI_CONTAINER_PATH}"
        bind:
          create_host_path: true
      - "ref_vite_node_modules:${REFERENCE_UI_WORKING_DIR}/node_modules"
    environment:
      REFERENCE_UI_PATH: "${REFERENCE_UI_CONTAINER_PATH}"
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING}"
    command: >
      sh -c "if [ ! -f package.json ]; then
               echo 'Reference React source not found; starting fallback Vite server.';
               exec /opt/vite-fallback/node_modules/.bin/vite /opt/vite-fallback --host 0.0.0.0 --port ${REFERENCE_UI_CONTAINER_PORT};
             fi;
             if [ ! -x node_modules/.bin/vite ]; then yarn install; fi &&
             exec yarn dev --host 0.0.0.0 --port ${REFERENCE_UI_CONTAINER_PORT}"
    networks:
      - web-network

  tomcat-frontend:
    build:
      context: .
      dockerfile: "${TOMCAT_DOCKERFILE}"
    image: "${TOMCAT_IMAGE}"
    container_name: tomcat-frontend-${APP_NAME}
    ports:
      - "${FRONTWAS_BIND_ADDRESS}:${FRONTWAS_PORT}:${FRONTWAS_CONTAINER_PORT}"
    restart: unless-stopped
    networks:
      - web-network

volumes:
  vite_node_modules:
  ref_vite_node_modules:

networks:
  web-network:
    driver: bridge
