name: front-${APP_NAME}

services:
  nginx-web:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx-web-${APP_NAME}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - vite-devserver
      - tomcat-frontend
    restart: unless-stopped
    networks:
      - web-frontwas-network

  vite-devserver:
    build:
      context: .
      dockerfile: vite-devserver/Dockerfile.dev
    container_name: vite-devserver-${APP_NAME}
    working_dir: /workspace/web-ui
    init: true
    expose:
      - "8183"
    volumes:
      - type: bind
        source: "${WEB_UI_HOST_PATH:-../web-ui}"
        target: /workspace/web-ui
        bind:
          create_host_path: false
      - vite_node_modules:/workspace/web-ui/node_modules
    environment:
      WEB_UI_PATH: /workspace/web-ui
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    networks:
      - web-frontwas-network

  tomcat-frontend:
    build:
      context: ..
      dockerfile: ./nginx-vite-tomcat-env/tomcat-frontend/Dockerfile
    image: tomcat-frontend:${APP_NAME}
    container_name: tomcat-frontend-${APP_NAME}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - web-frontwas-network
volumes:
  vite_node_modules:

networks:
 web-frontwas-network:
    name: web-frontwas-network-${APP_NAME}
    driver: bridge
