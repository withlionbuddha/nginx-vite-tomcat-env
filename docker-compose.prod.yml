name: frontweb-${APP_NAME}

services:
  nginx-staticweb:
    build:
      context: ..
      dockerfile: ./nginx-vite-tomcat-compose/nginx/Dockerfile.prod
    image: nginx-staticweb:${APP_NAME}
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    depends_on:
      - tomcat-frontweb
    restart: unless-stopped
    networks:
      - frontweb-network

  tomcat-frontweb:
    build:
      context: ..
      dockerfile: ./nginx-vite-tomcat-compose/tomcat-frontweb/Dockerfile
    image: tomcat-frontweb:${APP_NAME}
    container_name: tomcat-frontweb-${APP_NAME}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - frontweb-network

networks:
  frontweb-network:
    name: frontweb-network-${APP_NAME}
    driver: bridge
