name: frontwas-${APP_NAME:-earth-power-n4}-prod

services:
  tomcat-frontend:
    build:
      context: .
      dockerfile: tomcat/Dockerfile
      args:
        TOMCAT_VERSION: ${TOMCAT_VERSION:-10.1-jdk21-temurin}
    image: tomcat-frontend:${APP_NAME:-earth-power-n4}-prod
    container_name: tomcat-frontend-${APP_NAME:-earth-power-n4}-prod
    ports:
      - "${FRONTWAS_HOST_ADDRESS:-127.0.0.1}:${FRONTWAS_HOST_PORT:-8080}:${FRONTWAS_CONTAINER_PORT:-8080}"
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
