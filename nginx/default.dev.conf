server {
    listen 80;
    server_name localhost;   # 실제 인증서의 도메인으로 변경

    ssl_certificate     /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Public REST API -> internal Tomcat WAR context.
    # Keep the public API path unchanged: /api/users -> /api/users
    location /api/ {
        proxy_pass http://tomcat-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development React SPA / HMR
    location / {
        proxy_pass http://vite-devserver:83;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
