server {
    listen 80;
    server_name _;

    # This Compose configuration intentionally has no Front WAS.
    location /api/ {
        return 404;
    }

    # Standalone React development and HMR, without a Tomcat dependency.
    location / {
        proxy_pass http://vite-devserver:8183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
