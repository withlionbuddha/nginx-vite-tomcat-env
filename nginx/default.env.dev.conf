# HTTP 요청을 HTTPS로 이동
server {
    listen ${NGINX_CONTAINER_PORT};
    server_name ${SERVER_NAME};

    return 301 https://$host$request_uri;
}

server {
    listen ${NGINX_CONTAINER_SSL_PORT} ssl;

    server_name ${SERVER_NAME};
    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    
    # Public REST API -> internal Tomcat WAR context.
    # Keep the public API path unchanged: /api/users -> /api/users
    location /api/ {
        proxy_pass http://${TOMCAT_HOST}:${TOMCAT_PORT};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Development React SPA / HMR
    location / {
        proxy_pass http://vite-devserver:83;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
