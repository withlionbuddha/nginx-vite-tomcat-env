name: frontwas-${APP_NAME}-dev

services:
  tomcat-frontend:
    build:
      context: .
      dockerfile: tomcat-frontend/Dockerfile
      additional_contexts:
        frontwas_source: "${FRONTWAS_HOST_PATH:-../frontend}"
    image: tomcat-frontend:${APP_NAME}
    container_name: tomcat-frontend-${APP_NAME}
    ports:
      - "${FRONTWAS_BIND_ADDRESS:-127.0.0.1}:${FRONTWAS_PORT:-18080}:8080"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
