name: frontwas-${APP_NAME:-earth-power-n4}-dev

services:
  tomcat-frontend:
    working_dir: /workspace
    volumes:
      - ${FRONTEND_SOURCE_PATH}:/workspace
    build:
      context: .
      dockerfile: tomcat/Dockerfile
      args:
        TOMCAT_VERSION: ${TOMCAT_VERSION:-10.1-jdk21-temurin}
    image: tomcat-frontend:${APP_NAME:-earth-power-n4}-dev
    container_name: tomcat-frontend-${APP_NAME:-earth-power-n4}-dev
    ports:
      - "${FRONTWAS_BIND_ADDRESS:-127.0.0.1}:${FRONTWAS_DEV_PORT:-18080}:8080"
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
