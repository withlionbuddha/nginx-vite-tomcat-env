name: frontwas-${APP_NAME:-earth-power-n4}-dev

services:
  tomcat-frontend:
    working_dir: /workspace
    volumes:
      - ${FRONTEND_SOURCE_PATH}:/workspace
      - maven-repository:/root/.m2/repository
    build:
      context: .
      dockerfile: tomcat/Dockerfile.dev
      args:
        TOMCAT_VERSION: ${TOMCAT_VERSION:-10.1-jdk21-temurin}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.11}
    image: tomcat-frontend:${APP_NAME:-earth-power-n4}-dev
    container_name: tomcat-frontend-${APP_NAME:-earth-power-n4}-dev
    ports:
      - "${FRONTWAS_BIND_ADDRESS:-127.0.0.1}:${FRONTWAS_DEV_PORT:-18080}:8080"
    restart: unless-stopped
    networks:
      - web-network

  redis:
    image: redis:7.4-alpine
    container_name: redis-${APP_NAME:-earth-power-n4}-dev
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
       - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  maven-repository:
  redis-data:
