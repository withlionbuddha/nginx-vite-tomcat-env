name: staticweb-${APP_NAME}-dev

services:
  nginx-staticweb:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.staticweb.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vite-devserver
    restart: unless-stopped
    networks:
      - web-network

  vite-devserver:
    build:
      context: .
      dockerfile: vite-devserver/Dockerfile.dev
    container_name: vite-devserver-${APP_NAME}
    working_dir: /workspace/react-web-ui
    init: true
    expose:
      - "8183"
    volumes:
      - type: bind
        source: "${WEB_UI_SOURCE_PATH:-../react-web-ui}"
        target: /workspace/react-web-ui
        bind:
          create_host_path: false
      - vite_node_modules:/workspace/react-web-ui/node_modules
    environment:
      WEB_UI_PATH: /workspace/react-web-ui
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    networks:
      - web-network

volumes:
  vite_node_modules:

networks:
  web-network:
    driver: bridge
