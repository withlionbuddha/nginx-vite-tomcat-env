name: frontweb-${APP_NAME}

services:
  nginx-staticweb:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${STATICWEB_BIND_ADDRESS:-127.0.0.1}:${STATICWEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.staticweb.dev.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - vite-devserver
    restart: unless-stopped
    networks:
      - frontweb-network

  vite-devserver:
    build:
      context: .
      dockerfile: vite-devserver/Dockerfile.dev
    container_name: vite-devserver-${APP_NAME}
    working_dir: /workspace/web-ui
    init: true
    expose:
      - "8183"
    volumes:
      - type: bind
        source: "${WEB_UI_HOST_PATH:-../web-ui}"
        target: /workspace/web-ui
        bind:
          create_host_path: false
      - vite_node_modules:/workspace/web-ui/node_modules
    environment:
      WEB_UI_PATH: /workspace/web-ui
      CHOKIDAR_USEPOLLING: "${VITE_USE_POLLING:-true}"
    networks:
      - frontweb-network

volumes:
  vite_node_modules:

networks:
  frontweb-network:
    name: frontweb-network-${APP_NAME}
    driver: bridge
