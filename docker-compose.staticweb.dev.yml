name: frontweb-${APP_NAME}

services:
  nginx-staticweb:
    image: nginx:1.30.4-alpine3.24
    container_name: nginx-staticweb-${APP_NAME}
    ports:
      - "${STATICWEB_BIND_ADDRESS:-127.0.0.1}:${STATICWEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.staticweb.dev.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - vite-devserver
    restart: unless-stopped
    networks:
      - frontweb-network

  vite-devserver:
    build:
      context: ..
      dockerfile: ./nginx-vite-tomcat-compose/vite-devserver/Dockerfile.dev
    container_name: vite-devserver-${APP_NAME}
    expose:
      - "8183"
    volumes:
      - ../web-ui:/app
      - vite_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - frontweb-network

  web-ui-init:
    image: node:24.20.0-bookworm
    container_name: web-ui-init-${APP_NAME}
    profiles:
      - init
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f web-ui/package.json ]; then
          npm create vite@latest web-ui -- --template react-ts
        fi
        cd web-ui
        npm install

volumes:
  vite_node_modules:

networks:
  frontweb-network:
    name: frontweb-network-${APP_NAME}
    driver: bridge
